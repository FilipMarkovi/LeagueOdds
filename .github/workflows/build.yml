name: Build Windows Executable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy xgboost scikit-learn joblib requests pyinstaller

    - name: Build with PyInstaller
      run: |
        # --onefile packages everything into a single .exe
        # --noconsole hides the black command prompt window
        # --add-data bundles your local model file into the executable (format: "file_to_bundle;destination_folder")
        pyinstaller --onefile --noconsole --add-data "lol_win_predictor_model.pkl;." live_predictor.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LoL-Win-Predictor-Windows
        path: dist/live_predictor.exe